    const s=raw.trim();
    let m;
    m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:T.*)?$/);
    if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
    if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    m=s.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
    if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    m=s.match(/^(\d{2,3})年(\d{1,2})月(\d{1,2})日$/);
    if(m){const y=parseInt(m[1],10)+1911;return y+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0")}
    m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m)return m[3]+"-"+String(m[1]).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0");
    m=s.match(/^[A-Za-z]{3}\/([A-Za-z]{3})\s+(\d{1,2}),\s*(\d{4})$/);
    if(m){const mo=MONTH_MAP[m[1].toUpperCase()];if(mo)return m[3]+"-"+String(mo).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0")}
  }
  if(typeof fallbackCheckedAt==="string"){
    const m2=fallbackCheckedAt.match(/^(\d{4}-\d{2}-\d{2})/);
    if(m2)return m2[1]
  }
  return null
}

 r.setProperty('--side',side+'px');/* 名稱固定寬度＝最長的彩券名，讓四種彩券的日期對齊 */r.setProperty('--nw',Math.ceil(Math.max(...ORDER.map(g=>probe(nm(g),'font-weight:700;font-size:'+px(FN)).width)))+'px');

<!--
好運旺旺進財來 規則（2026-10-07 與使用者定案）
一、方法 20 種：十字差(0,±1,±10)、同尾差(0,±10)、隔壁差(0,±1)、X差(0,±9,±11)；兩段組合 16 種取統計表前 3 顆，單用 4 種取第一段基數。繞回 539/天天樂 1~39、六合彩/大樂透 1~49；特別號不計命中。
二、排行推薦：每期回溯 30 期，20 種方法依三期內開出率排名（同分看 100 期）；取前 5 名（六合彩前 3 名）。兩段組合無號碼時拆成第一段單用＋第二段單用一起統計取 3 顆，兩邊都無才跳下一名。依票數取前 3 顆，同票時排名高者優先；採用的方法合起來不足 3 顆時，繼續往下一名找，直到湊滿 3 顆。
三、關聯推薦：每期回溯 30 期，190 組配對統計兩方法在同一期各中至少 1 顆的比例（兩方法皆有號碼至少 10 期）；從最高配對起取兩方法號碼聯集，任一方法無號碼就換下一組；2026-10-07 起固定 8 顆：不足 8 顆繼續加入下一組，超過 8 顆依票數取前 8 顆（配對全部用完仍不足才少於 8 顆）。
資料：每次打開自動從爬蟲資料庫（lottery-data-gate 閘道）同步新期數，讀不到就用內建資料；新期數存在手機 localStorage。
四、成效紀錄：自追蹤起點的下一期開始，不回填。排行推薦看三期內開出（未滿三期為觀察中）；關聯推薦看同期中幾顆，與同顆數隨機期望比較。
五、成效回饋：方法與配對的追蹤實際命中滿 10 期後，排名分數＝回溯30期×0.7＋追蹤實際×0.3；每滿 10 期比較前 3 名與前 5 名的實際成效，較好者用於排行推薦；排行推薦累積滿 60 顆仍低於隨機、或關聯推薦滿 20 筆仍低於隨機期望，標示「暫停參考」。
